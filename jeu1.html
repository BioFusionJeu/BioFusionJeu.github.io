<!-- Ceci crée une zone capable de recevoir un texte glissé avec l'événement ondrop et autorise le survol de la souris avec l'événement ondragover -->
<!--Source : https://www.w3schools.com/html/tryit.asp?filename=tryhtml5_draganddrop_h1-->
<div class="image"> 
  <div id="Coeur" class="deposer" ondrop="dropHandler(event)" ondragover="dragoverHandler(event)"></div>
  <div id="Poumon" class="deposer" ondrop="dropHandler(event)" ondragover="dragoverHandler(event)"></div>
  <div id="Estomac" class="deposer" ondrop="dropHandler(event)" ondragover="dragoverHandler(event)"></div>
  <div id="Rein" class="deposer" ondrop="dropHandler(event)" ondragover="dragoverHandler(event)"></div>
  <div id="Intestin" class="deposer" ondrop="dropHandler(event)" ondragover="dragoverHandler(event)"></div>
  <div id="Cerveau" class="deposer" ondrop="dropHandler(event)" ondragover="dragoverHandler(event)"></div>
</div>


<script>
  //source : https://www.w3schools.com/html/tryit.asp?filename=tryhtml5_draganddrop_h1
  function dragstartHandler(ev) {
    ev.dataTransfer.setData("text", ev.target.id);
  }
  
  function dragoverHandler(ev) {
    ev.preventDefault();
  }
  
  function dropHandler(ev) {
    ev.preventDefault();
    //  trouver l'ID du mot (par ex: "txtCoeur")
    let idMot = ev.dataTransfer.getData("text");
    let motElement = document.getElementById(idMot);

    // Correction : ev.currentTarget pointe toujours sur la boîte, pas sur un enfant
    let dépose = ev.currentTarget;
  
    //pour que le mot se dépose dans la boîte
    dépose.appendChild(motElement);
  
    
    // regarde si l'ID du mot contient l'ID de la boîte (par ex: si "txtCoeur" contient "Coeur")
    if (idMot.includes(dépose.id)) {
      //pour ajouter un style dans la balise script on utilise .style
      //source :  https://gomakethings.com/two-ways-to-set-an-elements-css-with-vanilla-javascript/
      dépose.style.border = "1px solid #02ba39";
      motElement.style.color = "#02ba39"
      
    } else {
      dépose.style.border = "1px solid #ba0202"; // Rouge
      motElement.style.color = "#ba0202"
    }
  }
</script>

<!-- Ceci crée un texte glissable avec un nom (par ex: "Poumon" qui déclenche la fonction "dragstartHandler" quand l'utilisateur commence à le glisser-->
<!-- https://www.w3schools.com/html/tryit.asp?filename=tryhtml5_draganddrop_h1 -->
<div id="mots">
  <p id="txtPoumon" draggable="true" ondragstart="dragstartHandler(event)">Poumon</p> 
  <p id="txtCoeur" draggable="true" ondragstart="dragstartHandler(event)">Coeur</p>
  <p id="txtIntestin" draggable="true" ondragstart="dragstartHandler(event)">Intestin</p>
  <p id="txtRein" draggable="true" ondragstart="dragstartHandler(event)">Rein</p>
  <p id="txtEstomac" draggable="true" ondragstart="dragstartHandler(event)">Estomac</p>
  <p id="txtCerveau" draggable="true" ondragstart="dragstartHandler(event)">Cerveau</p>
</div>

<button class="btnMenu" onclick="window.location.href='index.html'"><img src="https://cdn-icons-png.flaticon.com/512/5895/5895964.png" height="35px"></button>
