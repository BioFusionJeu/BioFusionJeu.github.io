
<!-- Page jeu 1 -->
<!-- Par BioFusion-->
 <!-- Changé par l'IA
Avant
#Coeur { ... }

Après 
[data-id="Coeur"] { ... } 
-->

<!DOCTYPE HTML>
<html>
  
<head>
  <meta charset="UTF-8">
  <title>Jeu 1</title>
  <link rel="stylesheet" href="style/style.css">
  <link rel="icon" type="image/png" href="images/biofusion.png">
</head>

<body>
  <button class="btnMenu" onclick="window.location.href='index.html'"><img src="https://cdn-icons-png.flaticon.com/512/5895/5895964.png" height="35px"></button>
  <style>

    body { background-color: #f0f0e8; }
.image {
  background-image: url("images/corps.avif");
  background-size: contain;
  background-repeat: no-repeat;
  background-position: center;
  position: relative; 
  width: 700px;
  height: 900px;
  margin: 0 auto;
  border: 0px;
}

[data-id="Coeur"] {
  position: absolute;
  top: 45%;
  left: 53%;
  width: 85px;
  height: 30px;
  border: 1px solid #333;
}

[data-id="Poumon"] {
  position: absolute;
  top: 48%;
  left: 27%;
  width: 85px;
  height: 30px;
  border: 1px solid #333;
}

[data-id="Estomac"] {
  position: absolute;
  top: 55%;
  left: 56%;
  width: 85px;
  height: 30px;
  border: 1px solid #333;
}

[data-id="Rein"] {
  position: absolute;
  top: 58%;
  left: 29%;
  width: 85px;
  height: 30px;
  border: 1px solid #333;
}

[data-id="Intestin"] {
  position: absolute;
  top: 64%;
  left: 56%;
  width: 85px;
  height: 30px;
  border: 1px solid #333;
}

[data-id="Cerveau"] {
  position: absolute;
  top: 20%;
  left: 52%;
  width: 85px;
  height: 30px;
  border: 1px solid #333;
}

.deposer {
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px dashed #000000;
  border-radius: 6px;
  background-color: rgba(255,255,255,0.6);
}

#mots {
  position: fixed;
  left: 20px;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  flex-direction: column;
  gap: 8px;
}

#mots p {
  margin: 0;
  padding: 6px 10px;
  border: 2px solid #000000;
  border-radius: 8px;
  background-color: rgba(255,255,255,0.6);
  color: #1a1a2e;
  cursor: grab;
  box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
}
  </style>

<div class="image">
  <div data-id="Coeur" class="deposer" ondrop="dropHandler(event)" ondragover="dragoverHandler(event)"></div>
  <div data-id="Poumon" class="deposer" ondrop="dropHandler(event)" ondragover="dragoverHandler(event)"></div>
  <div data-id="Estomac" class="deposer" ondrop="dropHandler(event)" ondragover="dragoverHandler(event)"></div>
  <div data-id="Rein" class="deposer" ondrop="dropHandler(event)" ondragover="dragoverHandler(event)"></div>
  <div data-id="Intestin" class="deposer" ondrop="dropHandler(event)" ondragover="dragoverHandler(event)"></div>
  <div data-id="Cerveau" class="deposer" ondrop="dropHandler(event)" ondragover="dragoverHandler(event)"></div>
</div>

<script>
  function dragstartHandler(ev) {
    ev.dataTransfer.setData("text", ev.target.dataset.mot);
  }
  
  function dragoverHandler(ev) {
    ev.preventDefault();
  }
  
  function dropHandler(ev) {
    ev.preventDefault();
    let idMot = ev.dataTransfer.getData("text");
    let motElement = document.querySelector(`[data-mot="${idMot}"]`);
    let dépose = ev.currentTarget;
  
    dépose.appendChild(motElement);
  
    if (idMot.includes(dépose.dataset.id)) {
      dépose.style.border = "1px solid #02ba39";
      motElement.style.color = "#02ba39";
    } else {
      dépose.style.border = "1px solid #ba0202";
      motElement.style.color = "#ba0202";
    }
  }
</script>

<div id="mots">
  <p data-mot="txtPoumon" draggable="true" ondragstart="dragstartHandler(event)">Poumon</p> 
  <p data-mot="txtCoeur" draggable="true" ondragstart="dragstartHandler(event)">Coeur</p>
  <p data-mot="txtIntestin" draggable="true" ondragstart="dragstartHandler(event)">Intestin</p>
  <p data-mot="txtRein" draggable="true" ondragstart="dragstartHandler(event)">Rein</p>
  <p data-mot="txtEstomac" draggable="true" ondragstart="dragstartHandler(event)">Estomac</p>
  <p data-mot="txtCerveau" draggable="true" ondragstart="dragstartHandler(event)">Cerveau</p>
</div>

</body>
</html>
