    '<input type="radio" name="QCe" value="0"> Le lobe frontal<br>' +
    '<input type="radio" name="QCe" value="0"> L\'hippocampe'+
    '<br><br><input type="button" id="btnValider1" class="btnMenu"onclick="valider(\'QCe\')" value="Valider">'+
    '<div id="rep"></div>'
}
// Fonction unique pour valider n'importe quelle question
function valider(nomQuestion) {
  let options = document.getElementsByName(nomQuestion);
  let selectionne = false;
  let reponseCorrecte = false;

  for (let i = 0; i < options.length; i++) {
    if (options[i].checked) {
      selectionne = true;
      if (options[i].value == "1") {
        reponseCorrecte = true;
      }
      break;
    }
  }

  var divReponse = document.getElementById("rep");
  if (!selectionne) {
    divReponse.innerHTML = "<p class='resultat' style='color: orange;'>Veuillez sélectionner une réponse.</p>";
  } else if (reponseCorrecte) {
    divReponse.innerHTML = "<p class='resultat' style='color: #02ba39;'>Bonne réponse ";
  } else {
    divReponse.innerHTML = "<p class='resultat' style='color: #ba0202;'>Mauvaise réponse.";
  
     // On enlève une vie quand la réponse est mauvaise
        chances--; 
        document.getElementById("vies").innerText = chances;
        
        // On désactive le bouton de validation raté si C'est mauvais
        document.getElementById("btnValider1").disabled = true;

        // Page game over
        if (chances <= 0) {
          window.location.href = "mort2.html";
    }
  }
}
